name: Update

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  Update_mirror:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 1
    - name: Tune git for large pushes
      run: |
        git config --global http.version HTTP/1.1
        git config --global http.postBuffer 524288000
    - name: Get current date
      id: date
      run: echo "date=$(date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"
    - name: Install wget2
      run: |
        sudo apt update
        sudo apt install -y wget2
    - name: Update with wget
      continue-on-error: true
      run: |
        rm -rf docs.samsungknox.com
        wget2 -m -np -E -k -p -e robots=off --restrict-file-names=windows --max-threads 24 https://docs.samsungknox.com
    - name: Create archive
      run: |
        tar acf 'docs.samsungknox.com_${{ steps.date.outputs.date }}.tar' docs.samsungknox.com
        zstd --ultra -3 'docs.samsungknox.com_${{ steps.date.outputs.date }}.tar'
    - name: Archive file
      uses: actions/upload-artifact@v7.0.1
      with:
        name: 'docs.samsungknox.com_${{ steps.date.outputs.date }}'
        path: 'docs.samsungknox.com_${{ steps.date.outputs.date }}.tar.zst'
    - name: Remove unnecessary files
      run: |
        rm -rf docs.samsungknox.com_${{ steps.date.outputs.date }}.tar.zst docs.samsungknox.com_${{ steps.date.outputs.date }}.tar
        find docs.samsungknox.com -name '*.apk' -delete
        find docs.samsungknox.com -size +100M -delete
    - name: Add files and commit in batches
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "github-actions"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A

        mapfile -d '' files < <(git diff --cached --name-only -z)

        git reset

        batch_size=500
        total_files=${#files[@]}
        total_batches=$(( (total_files + batch_size - 1) / batch_size ))

        for ((i=0; i<total_files; i+=batch_size)); do
          batch=( "${files[@]:i:batch_size}" )
          batch_number=$((i / batch_size + 1))

          git add -A -- "${batch[@]}"

          if ! git diff --cached --quiet; then
            git commit -m "Update ${{ steps.date.outputs.date }} batch ${batch_number}/${total_batches}"
            git push origin HEAD
          fi
        done

    - name: Update badge
      uses: RubbaBoy/BYOB@v1.3.0
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NAME: Update
        ICON: 'https://raw.githubusercontent.com/google/material-design-icons/master/src/action/update/materialicons/24px.svg'
        LABEL: 'Updated at'
        COLOR: 00FF00
        STATUS: ${{ steps.date.outputs.date }} UTC